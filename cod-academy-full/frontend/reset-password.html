<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Resetare Parolă — COD Academy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #050508;
      color: #f0f0f0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 16px;
      padding: 48px 40px;
      max-width: 420px;
      width: 100%;
      margin: 20px;
    }
    h1 {
      font-size: 1.5rem;
      margin-bottom: 8px;
      font-weight: 700;
    }
    p.subtitle {
      color: rgba(255,255,255,0.5);
      font-size: 0.9rem;
      margin-bottom: 32px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: rgba(255,255,255,0.6);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 10px;
      color: #f0f0f0;
      font-size: 1rem;
      outline: none;
      transition: border-color 0.2s;
      margin-bottom: 20px;
    }
    input:focus {
      border-color: #00e85e;
      box-shadow: 0 0 0 3px rgba(0,232,94,0.1);
    }
    button {
      width: 100%;
      padding: 14px;
      background: #00e85e;
      color: #050508;
      border: none;
      border-radius: 10px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    button:hover { opacity: 0.9; }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    .msg {
      padding: 12px 16px;
      border-radius: 10px;
      margin-bottom: 20px;
      font-size: 0.9rem;
      display: none;
    }
    .msg.error { display: block; background: rgba(255,59,48,0.15); border: 1px solid rgba(255,59,48,0.3); color: #ff6b6b; }
    .msg.success { display: block; background: rgba(0,232,94,0.1); border: 1px solid rgba(0,232,94,0.2); color: #00e85e; }
    .back-link {
      display: block;
      text-align: center;
      margin-top: 24px;
      color: rgba(255,255,255,0.4);
      text-decoration: none;
      font-size: 0.85rem;
    }
    .back-link:hover { color: #00e85e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Resetare Parolă</h1>
    <p class="subtitle">Introdu noua ta parolă.</p>

    <div id="msg" class="msg"></div>

    <form id="resetForm">
      <label for="password">Parolă nouă</label>
      <input type="password" id="password" name="password" placeholder="Minim 6 caractere" required minlength="6">

      <label for="confirmPassword">Confirmă parola</label>
      <input type="password" id="confirmPassword" placeholder="Repetă parola" required minlength="6">

      <button type="submit" id="submitBtn">Schimbă parola</button>
    </form>

    <a href="/login.html" class="back-link">← Înapoi la autentificare</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const token = params.get("token");
    const msgEl = document.getElementById("msg");
    const form = document.getElementById("resetForm");

    if (!token) {
      msgEl.className = "msg error";
      msgEl.textContent = "Link invalid — lipsește tokenul de resetare.";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("password").value;
      const confirm = document.getElementById("confirmPassword").value;

      if (password !== confirm) {
        msgEl.className = "msg error";
        msgEl.textContent = "Parolele nu se potrivesc.";
        return;
      }

      const btn = document.getElementById("submitBtn");
      btn.disabled = true;
      btn.textContent = "Se procesează...";

      try {
        const res = await fetch("/api/auth/reset-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token, password }),
        });

        const data = await res.json();

        if (res.ok) {
          msgEl.className = "msg success";
          msgEl.textContent = data.message || "Parola a fost schimbată!";
          form.style.display = "none";
          setTimeout(() => { window.location.href = "/login.html"; }, 2000);
        } else {
          msgEl.className = "msg error";
          msgEl.textContent = data.error || "Eroare la resetare.";
          btn.disabled = false;
          btn.textContent = "Schimbă parola";
        }
      } catch (err) {
        msgEl.className = "msg error";
        msgEl.textContent = "Eroare de rețea.";
        btn.disabled = false;
        btn.textContent = "Schimbă parola";
      }
    });
  </script>
</body>
</html>
