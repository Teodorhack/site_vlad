<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>COD Academy — Admin Panel</title>
  <link href="https://api.fontshare.com/v2/css?f[]=satoshi@400,500,700,900&f[]=clash-display@400,500,600,700&f[]=jet-brains-mono@400,500&display=swap" rel="stylesheet">
  <style>
    :root{--s0:#050508;--s1:#0a0a0d;--s2:#101014;--s3:#18181c;--glow:#00e85e;--glow-dim:rgba(0,232,94,.06);--glow-mid:rgba(0,232,94,.14);--blue:#3b82f6;--violet:#a855f7;--red:#ef4444;--amber:#f59e0b;--edge:rgba(255,255,255,.06);--ink:rgba(255,255,255,.9);--ink50:rgba(255,255,255,.35);--font:'Satoshi',sans-serif;--fontD:'Clash Display',sans-serif;--fontM:'JetBrains Mono',monospace;--ease:cubic-bezier(.16,1,.3,1)}
    *{margin:0;padding:0;box-sizing:border-box}
    body{font-family:var(--font);background:var(--s0);color:var(--ink);min-height:100vh;-webkit-font-smoothing:antialiased}
    body::before{content:'';position:fixed;inset:0;z-index:0;pointer-events:none;opacity:.025;background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");background-size:256px}

    .admin-header{padding:20px 32px;border-bottom:1px solid var(--edge);display:flex;align-items:center;gap:16px;background:rgba(5,5,8,.8);backdrop-filter:blur(20px);position:sticky;top:0;z-index:10}
    .admin-header h1{font-family:var(--fontD);font-size:1.3rem;font-weight:600;letter-spacing:-.02em;flex:1}
    .admin-header .badge{font-family:var(--fontM);font-size:9px;font-weight:600;padding:4px 10px;border-radius:20px;background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.15);letter-spacing:1px;text-transform:uppercase}
    .back-btn{background:var(--s2);border:1px solid var(--edge);color:var(--ink50);padding:8px 16px;border-radius:8px;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;transition:all .2s;text-decoration:none}
    .back-btn:hover{border-color:rgba(255,255,255,.12);color:var(--ink)}

    .admin-body{padding:28px 32px;max-width:1200px;position:relative;z-index:1}

    /* Stats */
    .stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:32px}
    .stat-box{background:var(--s1);border:1px solid var(--edge);border-radius:14px;padding:18px 20px;transition:all .25s var(--ease)}
    .stat-box:hover{border-color:rgba(255,255,255,.1);transform:translateY(-2px)}
    .stat-box .label{font-size:10px;font-weight:600;color:var(--ink50);text-transform:uppercase;letter-spacing:1px;margin-bottom:6px}
    .stat-box .value{font-family:var(--fontD);font-size:28px;font-weight:700}

    /* Users table */
    .section-title{font-family:var(--fontD);font-size:1.1rem;font-weight:600;margin-bottom:14px;display:flex;align-items:center;gap:10px}
    .section-title .count{font-family:var(--fontM);font-size:11px;color:var(--ink50);font-weight:400}

    .table-wrap{background:var(--s1);border:1px solid var(--edge);border-radius:14px;overflow:hidden}
    table{width:100%;border-collapse:collapse;font-size:13px}
    th{background:var(--s2);font-size:10px;font-weight:700;color:var(--ink50);text-transform:uppercase;letter-spacing:1px;padding:12px 16px;text-align:left;border-bottom:1px solid var(--edge)}
    td{padding:12px 16px;border-bottom:1px solid var(--edge);color:rgba(255,255,255,.7);vertical-align:middle}
    tr:last-child td{border-bottom:none}
    tr:hover td{background:rgba(255,255,255,.02)}

    .user-name{font-weight:600;color:var(--ink)}
    .user-email{font-size:11px;color:var(--ink50)}
    .role-badge{font-family:var(--fontM);font-size:9px;font-weight:600;padding:3px 8px;border-radius:20px;letter-spacing:.5px;text-transform:uppercase}
    .role-student{background:var(--glow-dim);color:var(--glow);border:1px solid var(--glow-mid)}
    .role-admin{background:rgba(239,68,68,.08);color:var(--red);border:1px solid rgba(239,68,68,.15)}
    .role-instructor{background:rgba(59,130,246,.08);color:var(--blue);border:1px solid rgba(59,130,246,.15)}

    .status-dot{width:7px;height:7px;border-radius:50%;display:inline-block;margin-right:5px}
    .status-active{background:var(--glow);box-shadow:0 0 6px rgba(0,232,94,.3)}
    .status-inactive{background:var(--red)}

    .action-btn{background:var(--s2);border:1px solid var(--edge);color:var(--ink50);padding:5px 10px;border-radius:6px;cursor:pointer;font-size:10px;font-weight:600;font-family:var(--font);transition:all .2s;margin-right:4px}
    .action-btn:hover{border-color:rgba(255,255,255,.15);color:var(--ink)}
    .action-btn.danger:hover{border-color:rgba(239,68,68,.3);color:var(--red);background:rgba(239,68,68,.05)}
    .action-btn.success:hover{border-color:var(--glow-mid);color:var(--glow);background:var(--glow-dim)}

    .empty-state{text-align:center;padding:60px 20px;color:var(--ink50)}
    .empty-state .icon{font-size:48px;margin-bottom:12px}

    /* Modal */
    .modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(8px);z-index:100;align-items:center;justify-content:center}
    .modal-overlay.show{display:flex}
    .modal{background:var(--s1);border:1px solid var(--edge);border-radius:16px;padding:28px;width:90%;max-width:400px;animation:fadeIn .3s var(--ease)}
    .modal h3{font-family:var(--fontD);font-size:1.1rem;margin-bottom:16px}
    .modal .fg{margin-bottom:14px}
    .modal .fg label{display:block;font-size:10px;font-weight:600;color:var(--ink50);letter-spacing:1px;text-transform:uppercase;margin-bottom:5px}
    .modal .fi{width:100%;padding:10px 14px;background:var(--s2);border:1px solid var(--edge);border-radius:10px;color:#f0f0f0;font-family:var(--font);font-size:13px;outline:none}
    .modal .fi:focus{border-color:rgba(0,232,94,.3)}
    .modal-btns{display:flex;gap:8px;margin-top:18px}
    .modal-btns button{flex:1;padding:10px;border:none;border-radius:10px;font-family:var(--font);font-size:12.5px;font-weight:600;cursor:pointer;transition:all .2s}
    .modal-btns .cancel{background:var(--s2);color:var(--ink50);border:1px solid var(--edge)}
    .modal-btns .confirm{background:var(--glow);color:var(--s0)}

    @keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:768px){.admin-body{padding:16px}.stats-grid{grid-template-columns:1fr 1fr}table{font-size:11px}th,td{padding:8px 10px}}
  </style>
  <script>
    (function(){
      var token = localStorage.getItem("cod_token");
      if (!token) { window.location.href = "login.html"; return; }
      // Check admin role
      try {
        var user = JSON.parse(localStorage.getItem("cod_user") || "{}");
        if (user.role !== "admin") { window.location.href = "index.html"; }
      } catch(e) { window.location.href = "login.html"; }
    })();
  </script>
</head>
<body>

<header class="admin-header">
  <a href="index.html" class="back-btn">← Înapoi la curs</a>
  <h1>🛡️ Admin Panel</h1>
  <span class="badge">Admin Only</span>
</header>

<div class="admin-body">
  <!-- Stats -->
  <div class="stats-grid" id="statsGrid">
    <div class="stat-box"><div class="label">Total utilizatori</div><div class="value" style="color:var(--glow)" id="statUsers">-</div></div>
    <div class="stat-box"><div class="label">Utilizatori activi</div><div class="value" style="color:var(--blue)" id="statActive">-</div></div>
    <div class="stat-box"><div class="label">Module</div><div class="value" style="color:var(--violet)" id="statModules">-</div></div>
    <div class="stat-box"><div class="label">Lecții completate</div><div class="value" style="color:var(--amber)" id="statCompletions">-</div></div>
  </div>

  <!-- Users -->
  <div class="section-title">Utilizatori <span class="count" id="userCount"></span></div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th>ID</th><th>Utilizator</th><th>Email</th><th>Rol</th><th>Status</th><th>Creat</th><th>Acțiuni</th>
        </tr>
      </thead>
      <tbody id="usersTable">
        <tr><td colspan="7" class="empty-state"><div class="icon">⏳</div>Se încarcă...</td></tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Reset Password Modal -->
<div class="modal-overlay" id="resetModal">
  <div class="modal">
    <h3>🔐 Resetare parolă</h3>
    <p style="font-size:12px;color:var(--ink50);margin-bottom:16px">Setează o parolă nouă pentru utilizator: <strong id="resetUserName"></strong></p>
    <div class="fg">
      <label>Parolă nouă</label>
      <input type="password" class="fi" id="newPassword" placeholder="Minim 6 caractere">
    </div>
    <div class="modal-btns">
      <button class="cancel" onclick="closeModal()">Anulează</button>
      <button class="confirm" onclick="confirmReset()">Resetează</button>
    </div>
  </div>
</div>

<script>
const API = window.location.origin + "/api";
const TOKEN = localStorage.getItem("cod_token");

const headers = { "Content-Type": "application/json", "Authorization": "Bearer " + TOKEN };

let currentResetUserId = null;

async function loadData() {
  try {
    // Stats
    const statsRes = await fetch(API + "/admin/stats", { headers });
    if (statsRes.status === 403 || statsRes.status === 401) {
      alert("Nu ai permisiuni de admin.");
      window.location.href = "index.html";
      return;
    }
    const statsData = await statsRes.json();
    const s = statsData.stats;
    document.getElementById("statUsers").textContent = s.users;
    document.getElementById("statActive").textContent = s.active_users;
    document.getElementById("statModules").textContent = s.modules;
    document.getElementById("statCompletions").textContent = s.total_completions;

    // Users
    const usersRes = await fetch(API + "/admin/users", { headers });
    const usersData = await usersRes.json();
    document.getElementById("userCount").textContent = "(" + usersData.total + ")";

    const tbody = document.getElementById("usersTable");
    if (!usersData.users.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="empty-state"><div class="icon">👤</div>Niciun utilizator</td></tr>';
      return;
    }

    tbody.innerHTML = usersData.users.map(u => `
      <tr>
        <td style="font-family:var(--fontM);font-size:11px;color:var(--ink50)">#${u.id}</td>
        <td>
          <div class="user-name">${u.display_name || u.username}</div>
          <div class="user-email">@${u.username}</div>
        </td>
        <td style="font-size:12px">${u.email}</td>
        <td><span class="role-badge role-${u.role}">${u.role}</span></td>
        <td><span class="status-dot ${u.is_active ? 'status-active' : 'status-inactive'}"></span>${u.is_active ? 'Activ' : 'Inactiv'}</td>
        <td style="font-family:var(--fontM);font-size:10px;color:var(--ink50)">${u.created_at ? new Date(u.created_at).toLocaleDateString('ro-RO') : '-'}</td>
        <td>
          <button class="action-btn" onclick="changeRole(${u.id}, '${u.role}')">Rol</button>
          <button class="action-btn ${u.is_active ? 'danger' : 'success'}" onclick="toggleUser(${u.id})">${u.is_active ? 'Blochează' : 'Activează'}</button>
          <button class="action-btn" onclick="openReset(${u.id}, '${u.username}')">Resetare</button>
        </td>
      </tr>
    `).join("");
  } catch (err) {
    console.error("Admin load error:", err);
  }
}

async function changeRole(userId, currentRole) {
  const roles = ["student", "instructor", "admin"];
  const nextRole = roles[(roles.indexOf(currentRole) + 1) % roles.length];
  if (!confirm(`Schimbi rolul la "${nextRole}"?`)) return;
  await fetch(API + "/admin/users/" + userId + "/role", {
    method: "PUT", headers, body: JSON.stringify({ role: nextRole })
  });
  loadData();
}

async function toggleUser(userId) {
  if (!confirm("Sigur vrei să schimbi statusul?")) return;
  await fetch(API + "/admin/users/" + userId + "/toggle", { method: "PUT", headers });
  loadData();
}

function openReset(userId, username) {
  currentResetUserId = userId;
  document.getElementById("resetUserName").textContent = username;
  document.getElementById("newPassword").value = "";
  document.getElementById("resetModal").classList.add("show");
}

function closeModal() {
  document.getElementById("resetModal").classList.remove("show");
  currentResetUserId = null;
}

async function confirmReset() {
  const pw = document.getElementById("newPassword").value;
  if (pw.length < 6) { alert("Parola: minim 6 caractere."); return; }
  await fetch(API + "/admin/users/" + currentResetUserId + "/reset-password", {
    method: "PUT", headers, body: JSON.stringify({ password: pw })
  });
  closeModal();
  alert("Parola a fost resetată.");
}

loadData();
</script>
</body>
</html>
